name: CI

# Runs on every push and on pull requests.
# CI never calls the live Meta API: ROADSCOUT_PROVIDER=fake selects the fake
# provider (and, once they exist, recorded fixtures). No credentials are needed or used here.
on:
  push:
  pull_request:

permissions:
  contents: read

env:
  ROADSCOUT_PROVIDER: fake
  CI: "true"

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      # The Ubuntu mirror stalled for 15 minutes once, so each attempt is time-limited and retried.
      # apt keeps the packages it already downloaded, so retries resume instead of starting over.
      # Do not switch to a static ffmpeg build: its ffprobe segfaulted on the MPEG-TS test clip.
      # The downloaded .deb files are cached (and saved even when the install fails part-way),
      # so a slow mirror only has to be waited out once: each run resumes where the last stopped.
      - name: Restore apt package cache
        uses: actions/cache/restore@v6
        with:
          path: ~/apt-archives
          key: apt-ffmpeg-${{ github.run_id }}
          restore-keys: apt-ffmpeg-
      - name: Install ffmpeg
        timeout-minutes: 12
        run: |
          sudo mkdir -p "$HOME/apt-archives/partial"
          sudo apt-get update
          for attempt in 1 2 3 4; do
            if timeout 180 sudo apt-get install -y --no-install-recommends \
                -o Dir::Cache::archives="$HOME/apt-archives" -o Acquire::Retries=3 ffmpeg; then
              break
            fi
            if [ "$attempt" = 4 ]; then exit 1; fi
            echo "apt install attempt $attempt did not finish; retrying"
          done
          ffmpeg -version
          ffprobe -version
      - name: Save apt package cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ~/apt-archives
          key: apt-ffmpeg-${{ github.run_id }}
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run pytest
        run: python -m pytest

  playwright:
    name: playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install npm dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

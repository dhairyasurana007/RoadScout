name: CI

# Runs on every push and on pull requests.
# CI never calls the live Meta API: ROADSCOUT_PROVIDER=fake selects the fake
# provider (and, once they exist, recorded fixtures). No credentials are needed or used here.
on:
  push:
  pull_request:

permissions:
  contents: read

env:
  ROADSCOUT_PROVIDER: fake
  CI: "true"

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      # The Ubuntu mirror stalled for 15 minutes once, so each attempt is time-limited and retried.
      # apt keeps the packages it already downloaded, so retries resume instead of starting over.
      # Do not switch to a static ffmpeg build: its ffprobe segfaulted on the MPEG-TS test clip.
      - name: Install ffmpeg
        timeout-minutes: 10
        run: |
          sudo apt-get update
          for attempt in 1 2 3 4; do
            if timeout 150 sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 ffmpeg; then
              break
            fi
            if [ "$attempt" = 4 ]; then exit 1; fi
            echo "apt install attempt $attempt did not finish; retrying"
          done
          ffmpeg -version
          ffprobe -version
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run pytest
        run: python -m pytest

  playwright:
    name: playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install npm dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

name: mirror-speed-test

# Throwaway: measures download speed from a few sources on a GitHub runner. Deleted after use.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  speed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Measure
        run: |
          for u in \
            http://azure.archive.ubuntu.com/ubuntu/pool/universe/f/ffmpeg/libavcodec60_6.1.1-3ubuntu5_amd64.deb \
            http://archive.ubuntu.com/ubuntu/pool/universe/f/ffmpeg/libavcodec60_6.1.1-3ubuntu5_amd64.deb \
            http://us.archive.ubuntu.com/ubuntu/pool/universe/f/ffmpeg/libavcodec60_6.1.1-3ubuntu5_amd64.deb \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-linux64-gpl-7.1.tar.xz \
            https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz ; do
            curl -sL -o /dev/null --max-time 45 -w "%{speed_download} B/s  %{size_download} bytes  %{time_total}s  %{http_code}  $u\n" "$u" || echo "FAILED/timeout $u"
          done
          cat /etc/apt/apt-mirrors.txt || true
          ls /etc/apt/sources.list.d/
